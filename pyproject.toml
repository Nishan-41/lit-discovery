[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-discovery"
version = "1.0.0"
description = "Command-line scientific literature discovery and research intelligence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Rehan Hasnain" }
]
keywords = [
    "literature-discovery",
    "academic-search",
    "semantic-scholar",
    "scopus",
    "openalex",
    "scite-smart-citations",
    "connected-papers",
    "citation-graph",
    "elicit",
    "scispace",
    "zotero",
    "research-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/rehan-hasnain/lit-discovery"
Documentation = "https://github.com/rehan-hasnain/lit-discovery#readme"
Repository = "https://github.com/rehan-hasnain/lit-discovery.git"
"Bug Tracker" = "https://github.com/rehan-hasnain/lit-discovery/issues"

[project.scripts]
lit-discovery = "lit_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lit_discovery*"]
