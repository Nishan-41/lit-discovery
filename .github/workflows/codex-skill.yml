name: Chem-Mat-Hub skill
on:
  push:
    branches: [main]
    paths: ['codex/chem-mat-hub/**', '.github/workflows/codex-skill.yml']
  pull_request:
    branches: [main]
    paths: ['codex/chem-mat-hub/**', '.github/workflows/codex-skill.yml']
permissions:
  contents: read
jobs:
  test:
    name: Research CLI / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    defaults:
      run:
        working-directory: codex/chem-mat-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --rootdir . --confcutdir tests tests -q
