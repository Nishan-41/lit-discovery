name: Chem-Mat-Hub skill
on:
  push:
    paths: ['codex/chem-mat-hub/**', '.github/workflows/codex-skill.yml']
  pull_request:
    paths: ['codex/chem-mat-hub/**', '.github/workflows/codex-skill.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: codex/chem-mat-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --rootdir . --confcutdir tests tests -q
